<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f3d3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Household Ledger</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Household Ledger</span></div>
  <div class="hright"><div class="status" id="status"></div><button class="gear" data-view="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
</header>

<main id="main">
  <section id="view-home" class="view"></section>
  <section id="view-reports" class="view" hidden></section>
  <section id="view-pay" class="view" hidden></section>
  <section id="view-savings" class="view" hidden></section>
  <section id="view-data" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-view="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Dashboard</button>
  <button data-view="reports"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Reports</button>
  <button data-view="pay"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Pay</button>
  <button data-view="savings"><svg viewBox="0 0 24 24"><path d="M4 18l5-5 4 3 7-8M15 8h5v5"/></svg>Savings</button>
  <button data-view="data"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg>Statements</button>
</nav>

<dialog id="sheet"><div id="sheet-body"></div></dialog>

<script src="vendor/pdf.min.js"></script>
<script src="parser.js"></script>
<script src="readers.js"></script>
<script src="readers/monzo.js"></script>
<script src="readers/csv.js"></script>
<script src="rules.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
